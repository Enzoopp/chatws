services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: chat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-chat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-chat-local}
    ports:
      - "127.0.0.1:61613:61613"
      - "127.0.0.1:15672:15672"
    command: >-
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && docker-entrypoint.sh rabbitmq-server"
